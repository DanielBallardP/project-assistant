[project]
name = "project-assistant"
version = "0.1.0"
description = "A sample Project Assistant leveraging LLMs under the hood"
readme = "README.md"
authors = [
    { name = "Daniel Pfanzagl", email = "Daniel.Pfanzagl@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
project-assistant = "project_assistant:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
